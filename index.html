<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17150F; --paper:#F4EFE3; --line:#E1D9C4; --muted:#8A8371;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;
}
.serif{font-family:'Montserrat',-apple-system,sans-serif;font-weight:800;}
.app{max-width:460px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:14px 18px 12px;}

.daynav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none;}
.daynav::-webkit-scrollbar{display:none;}
.day-btn{background:none;border:none;font:600 14.5px/1 'Montserrat',sans-serif;color:var(--muted);
  padding:0 10px 9px;cursor:pointer;white-space:nowrap;position:relative;}
.day-btn.active{color:var(--ink);}
.day-btn.active::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--hue,#C7684F);}

.mealnav{display:flex;gap:6px;margin:10px 0;flex:none;}
.meal-tab{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
  padding:7px 4px;border-radius:999px;font:600 13px/1 'Montserrat',sans-serif;cursor:pointer;}
.meal-tab.active{background:var(--hue,#C7684F);color:#fff;border-color:transparent;}

.sheet{flex:1;min-height:0;display:flex;flex-direction:column;}
.kicker{display:flex;align-items:center;gap:7px;margin-bottom:2px;flex:none;}
.kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--hue,#C7684F);}
.kicker span{font:600 13.5px/1 'Montserrat',sans-serif;color:var(--hue,#C7684F);}
h1.title{font:600 26px/1.08 'Montserrat',sans-serif;margin:2px 0 3px;letter-spacing:-0.01em;flex:none;}
.tagline{font:italic 400 14.5px/1.3 'Montserrat',sans-serif;color:var(--muted);margin:0 0 10px;flex:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.hero{flex:none;position:relative;border-radius:18px;height:120px;margin-bottom:10px;
  background:linear-gradient(135deg,var(--hue-l,#FBDCCF),var(--paper) 85%);
  display:flex;align-items:center;padding:0 14px;overflow:hidden;}
.hero .illus{width:88px;height:88px;flex:none;}
.hero .ring-wrap{position:absolute;top:10px;right:10px;width:56px;height:56px;}
.hero .ring-wrap svg{transform:rotate(-90deg);}
.hero .ring-wrap .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.hero .ring-wrap .num b{font:700 15px/1 'Montserrat',sans-serif;}
.hero .ring-wrap .num span{font:600 8.5px/1 'Montserrat',sans-serif;color:var(--muted);}
.hero .pct{margin-left:12px;font:400 14px/1.35 'Montserrat',sans-serif;color:#544d3c;max-width:180px;}
.hero .pct b{color:var(--ink);font-weight:700;}

.macros{display:flex;gap:8px;margin-bottom:10px;flex:none;}
.macro{flex:1;border-radius:12px;padding:8px 6px;text-align:center;background:var(--bg);}
.macro b{display:block;font:700 18px/1.1 'Montserrat',sans-serif;color:var(--fg);}
.macro span{font:600 11px/1 'Montserrat',sans-serif;color:var(--fg);opacity:.65;}

.section-head{flex:none;font:600 13px/1 'Montserrat',sans-serif;color:var(--muted);margin-bottom:4px;}
.ing-scroll{flex:1;min-height:0;overflow-y:auto;}
.ing-row{display:flex;align-items:baseline;gap:6px;padding:6px 0;border-bottom:1px dotted var(--line);}
.ing-row .swatch{width:6px;height:6px;border-radius:50%;background:var(--hue,#C7684F);flex:none;}
.ing-row .name{font:400 15px/1.2 'Montserrat',sans-serif;}
.ing-row .leader{flex:1;border-bottom:1px dotted var(--line);margin-bottom:3px;min-width:10px;}
.ing-row .amt{font:600 13px/1 'Montserrat',sans-serif;color:var(--muted);white-space:nowrap;}

.daytotal{flex:none;margin-top:10px;background:var(--ink);color:var(--paper);border-radius:16px;
  padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-end;}
.daytotal .lbl{font:600 12.5px/1 'Montserrat',sans-serif;color:#B8B2A0;margin-bottom:4px;}
.daytotal .kcal{font:600 24px/1 'Montserrat',sans-serif;color:var(--hue,#C7DE3A);}
.daytotal .macros2{text-align:right;font:500 13px/1.5 'Montserrat',sans-serif;color:#D8D3C4;}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#141210;--line:#332F26;--ink:#F3EFE2;--muted:#948D78;}
  .hero{background:linear-gradient(135deg,var(--hue-d,#2b241f),var(--paper) 85%);}
}

:root{--dock:#fff}
.dock{flex:none;margin-top:8px;background:var(--dock);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:6px}
.daynav{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;border:none;overflow:visible}
.day-btn{padding:9px 0;border-radius:12px;text-align:center}
.day-btn.active{background:var(--hue-l);color:var(--hue)}
.day-btn.active::after{display:none}
.mealnav{margin:0}
.meal-tab{padding:10px 2px}
.hero{height:104px}.hero .illus{width:80px;height:80px}
.daytotal{padding:10px 16px;margin-top:8px}
.macro{padding:7px 6px}
.chip{flex:none;font:700 10.5px/1 'Montserrat',sans-serif;background:var(--hue-l);color:var(--hue);padding:4px 7px;border-radius:999px;white-space:nowrap}
.task{display:flex;gap:10px;padding:10px 0;border-bottom:1px dotted var(--line);align-items:flex-start}
.badge{flex:none;font:700 11px/1 'Montserrat',sans-serif;padding:5px 9px;border-radius:999px;margin-top:1px;background:var(--hue-l);color:var(--hue)}
.badge.order{background:#FBDACF;color:#B8401F}
.task b{display:block;font:700 14.5px/1.25 'Montserrat',sans-serif}
.task i{display:block;font:500 12.5px/1.3 'Montserrat',sans-serif;color:var(--muted);font-style:normal;margin-top:2px}
.task em{display:block;font:700 12px/1.2 'Montserrat',sans-serif;color:var(--hue);font-style:normal;margin-top:5px}
.empty{padding:22px 0;font:500 14px/1.4 'Montserrat',sans-serif;color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dock:#1E1C17}}

/* layout hardening: nothing may overlap on small screens */
.app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
.sheet{overflow:hidden;min-width:0}
.hero{flex:0 1 104px;min-height:52px;height:auto}
.hero .illus{height:78%;width:auto;aspect-ratio:1/1;max-height:80px}
.hero .illus svg{width:100%;height:100%;display:block}
.hero .pct{flex:1;min-width:0;max-width:none;padding-right:66px}
.ing-scroll{flex:1 1 auto;min-height:84px}
.meal-tab{min-width:0;white-space:nowrap;overflow:hidden;padding-left:0;padding-right:0}
.mealnav{gap:4px}
.meal-tab .sh{display:none}
.daytotal{gap:12px}
.daytotal>div:first-child{white-space:nowrap}
.daytotal .macros2{flex:1;min-width:0;font-size:12px}
@media (max-width:359px){.meal-tab .lg{display:none}.meal-tab .sh{display:inline}}
@media (max-width:380px){h1.title{font-size:20px}.app{padding-left:12px;padding-right:12px}}
@media (max-height:640px){.hero,.tagline{display:none}}
@media (max-height:540px){.macros{display:none}}
.mic{font:700 12px/1.3 'Montserrat',sans-serif;color:var(--hue)}
.foot{font:500 12.5px/1.4 'Montserrat',sans-serif;color:var(--muted);padding:8px 0}
</style>
</head>

    {label:"Lunch",title:"Dal Rice",tag:"Home-style, unhurried comfort.",cat:"bw",p:34,c:75,f:20,k:610,
     ing:[["Paneer","70g"],["Dal","1 cup"],["Rice","1 cup"],["Sautéed spinach","—"],["Ghee","1 tsp"]]},
    DIN[PLAN["Sunday"]],
    {label:"Evening Snack",title:"PB Toast & Apple",tag:"Quick, quiet, satisfying.",cat:"to",p:11,c:48,f:14,k:360,
     ing:[["Toast","2 slices"],["Peanut butter","1.5 tbsp"],["Apple","1"]]},
  ],
};
const TOTALS = {};
for(const d in DATA) TOTALS[d] = DATA[d].reduce((a,m)=>({p:a.p+m.p,c:a.c+m.c,f:a.f+m.f,k:a.k+m.k}),{p:0,c:0,f:0,k:0});
const DAYS = Object.keys(DATA), AB = DAYS.map(d=>d.slice(0,3));
let day = "Monday", meal = 0; // meal 4 = Prep
const $ = id => document.getElementById(id), root = document.documentElement;
HUES.Prep = {hue:"#3D6BD6",hl:"#DCE6FB",hd:"#0E1A38",bf:"#1B2F66"};

// Lead times in days. Mung = 2 (as requested); the rest are assumptions, edit freely.
const PREP = [
  {re:/mung sprouts|^sprouts$/i, lead:2, act:()=>'Start sprouting mung', note:'Soak 8–10 hrs, drain, rinse twice a day until sprouted', tag:'Sprout · 2 days'},
  {re:/rajma/i, lead:1, act:()=>'Soak rajma overnight', note:'Soak 8+ hrs, then pressure cook', tag:'Soak overnight'},
  {re:/^chana$|kala chana|chickpeas|^chole$/i, lead:1, act:n=>`Soak ${n.toLowerCase()} overnight`, note:'Soak 8+ hrs, then boil or pressure cook', tag:'Soak overnight'},
  {re:/hung curd/i, lead:1, act:()=>'Hang curd overnight', note:'Strain in muslin for 6–8 hrs, then refrigerate', tag:'Hang overnight'},
];
const STOCK = /^(protein|oats|peanut butter|nuts|almonds|walnuts|muesli|chia|dry soy chunks|basil pesto|pesto|dal|rajma|chana|kala chana|chole|chickpeas|besan cheela|corn|salsa)$/i;
const FRESH = /^(chicken|paneer|boiled eggs|eggs|egg|multigrain toast|toast|wheat kulcha)$/i;
const when = l => l===0 ? 'today' : l===1 ? 'tomorrow' : `in ${l} days`;

const TASKS = [], seen = {};
function add(di, lead, type, act, note, tgt, item){ TASKS.push({due:(di-lead+7)%7, lead, type, act, note, tgt, item}); }
DAYS.forEach((d,di)=>DATA[d].forEach((m,mi)=>{
  const tgt = {d:AB[di], m:m.label};
  if(/overnight oats/i.test(m.title)){
    const lead = mi===0 ? 1 : 0;
    add(di, lead, 'prep', 'Mix overnight oats', lead ? 'Mix tonight and chill overnight' : 'Mix this morning and chill 6+ hrs', tgt);
  }
  m.ing.forEach(([n])=>{
    const r = PREP.find(r=>r.re.test(n));
    if(r) add(di, r.lead, 'prep', r.act(n), r.note, tgt);
    const ty = STOCK.test(n) ? 2 : FRESH.test(n) ? 1 : 0, k = /eggs?$/i.test(n) ? 'eggs' : n.toLowerCase();
    if(ty && !seen[k]){ seen[k] = 1; add(di, ty, 'order', null, null, tgt, n); }
  });
}));
function tasksFor(di){
  const t = TASKS.filter(x=>x.due===di);
  const out = t.filter(x=>x.type==='prep').map(x=>({...x, em:`For ${x.tgt.d} ${x.tgt.m} · ${when(x.lead)}`}));
  [[2,'Order pantry staples','Allow ~2 days for delivery'],[1,'Order fresh items','Order a day ahead']].forEach(([l,a,em])=>{
    const g = t.filter(x=>x.type==='order' && x.lead===l);
    if(g.length) out.push({type:'order', act:a, em, note:g.map(x=>`${x.item==='Besan cheela'?'Besan flour':x.item} (${x.tgt.d})`).join(', ')});
  });
  return out;
}

function ring(pct,hue){
  const r=22, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="#ffffffa0" stroke-width="6"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="${hue}" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}
const tab = (i,l) => `<button class="meal-tab ${i===meal?'active':''}" data-i="${i}">${l}</button>`;

function render(){
  const di = DAYS.indexOf(day), isPrep = meal===4, m = isPrep ? null : DATA[day][meal];
  const H = isPrep ? HUES.Prep : HUES[m.label], t = TOTALS[day], tk = tasksFor(di);
  root.style.setProperty('--hue',H.hue); root.style.setProperty('--hue-l',H.hl); root.style.setProperty('--hue-d',H.hd);

  $('days').innerHTML = DAYS.map(d=>`<button class="day-btn ${d===day?'active':''}" data-d="${d}">${d.slice(0,3)}</button>`).join('');
  $('mealTabs').innerHTML = DATA[day].map((mm,i)=>tab(i, mm.label==='Evening Snack'?'Snack':mm.label==='Breakfast'?'<span class="lg">Breakfast</span><span class="sh">Bfast</span>':mm.label)).join('') + tab(4, `Prep${tk.length?' · '+tk.length:''}`);

  if(isPrep){
    $('sheet').innerHTML = `
      <div class="kicker"><span class="dot"></span><span>Prep &amp; order · ${day}</span></div>
      <h1 class="title serif">Get ahead</h1>
      <p class="tagline">${tk.length ? 'Start these today for meals coming up.' : 'Nothing to start today.'}</p>
      <div class="ing-scroll">${tk.map(x=>`
        <div class="task"><span class="badge ${x.type}">${x.type==='prep'?'Prep':'Order'}</span>
          <div><b>${x.act}</b><i>${x.note}</i><em>${x.em}</em></div></div>`).join('') || '<div class="empty">You\'re clear today — nothing to prep or order.</div>'}
      </div>`;
  } else {
    const pct = Math.min(1, m.k / t.k);
    $('sheet').innerHTML = `
      <div class="kicker"><span class="dot"></span><span>${m.label} · Day ${di+1} of 7</span></div>
      <h1 class="title serif">${m.title}</h1>
      <p class="tagline">${m.tag}</p>
      <div class="hero">
        <div class="illus">${ICONS[m.cat]}</div>
        <div class="pct">Covers <b>${Math.round(pct*100)}%</b> of the day's ${t.k} kcal.${m.mic?`<br><span class="mic">${m.mic}</span>`:''}</div>
        <div class="ring-wrap">${ring(pct,H.hue)}<div class="num"><b>${m.k}</b><span>KCAL</span></div></div>
      </div>
      <div class="macros">
        <div class="macro" style="--bg:${H.hl};--fg:${H.bf}"><b>${m.p}g</b><span>Protein</span></div>
        <div class="macro" style="--bg:#E4DEF5;--fg:#372A5C"><b>${m.c}g</b><span>Carbs</span></div>
        <div class="macro" style="--bg:#FCE9C4;--fg:#5C3D0B"><b>${m.f}g</b><span>Fats</span></div>
        ${m.fib?`<div class="macro" style="--bg:#D8F0DA;--fg:#1E5A2B"><b>${m.fib}g</b><span>Fibre</span></div>`:''}
      </div>
      <div class="section-head">Ingredients</div>
      <div class="ing-scroll">${m.ing.map(([name,amt])=>{
        const r = PREP.find(r=>r.re.test(name));
        return `<div class="ing-row"><span class="swatch"></span><span class="name">${name}</span>${r?`<span class="chip">${r.tag}</span>`:''}<span class="leader"></span><span class="amt">${amt}</span></div>`;
      }).join('')}${m.note?`<div class="foot">${m.note}</div>`:''}</div>`;
  }

  $('weekTotal').innerHTML = `
    <div><div class="lbl">${day} total</div><div class="kcal serif">${t.k}<span style="font-size:14px;"> kcal</span></div></div>
    <div class="macros2">${t.p}g protein${t.n?` (${t.n})`:''}<br>${t.c}g carbs · ${t.f}g fats</div>`;

  $('days').querySelectorAll('.day-btn').forEach(b=>b.onclick=()=>{day=b.dataset.d; render();});
  $('mealTabs').querySelectorAll('.meal-tab').forEach(b=>b.onclick=()=>{meal=+b.dataset.i; render();});
}
render();
</script>
</body>
</html>
