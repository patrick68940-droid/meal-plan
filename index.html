<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17150F; --paper:#F4EFE3; --line:#E1D9C4; --muted:#8A8371;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;
}
.serif{font-family:'Montserrat',-apple-system,sans-serif;font-weight:800;}
.app{max-width:460px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:14px 18px 12px;}

.daynav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none;}
.daynav::-webkit-scrollbar{display:none;}
.day-btn{background:none;border:none;font:600 12.5px/1 'Montserrat',sans-serif;color:var(--muted);
  padding:0 10px 9px;cursor:pointer;white-space:nowrap;position:relative;}
.day-btn.active{color:var(--ink);}
.day-btn.active::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--hue,#C7684F);}

.mealnav{display:flex;gap:6px;margin:10px 0;flex:none;}
.meal-tab{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
  padding:7px 4px;border-radius:999px;font:600 11px/1 'Montserrat',sans-serif;cursor:pointer;}
.meal-tab.active{background:var(--hue,#C7684F);color:#fff;border-color:transparent;}

.sheet{flex:1;min-height:0;display:flex;flex-direction:column;}
.kicker{display:flex;align-items:center;gap:7px;margin-bottom:2px;flex:none;}
.kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--hue,#C7684F);}
.kicker span{font:600 11.5px/1 'Montserrat',sans-serif;color:var(--hue,#C7684F);}
h1.title{font:600 24px/1.08 'Montserrat',sans-serif;margin:2px 0 3px;letter-spacing:-0.01em;flex:none;}
.tagline{font:italic 400 12.5px/1.3 'Montserrat',sans-serif;color:var(--muted);margin:0 0 10px;flex:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.hero{flex:none;position:relative;border-radius:18px;height:120px;margin-bottom:10px;
  background:linear-gradient(135deg,var(--hue-l,#FBDCCF),var(--paper) 85%);
  display:flex;align-items:center;padding:0 14px;overflow:hidden;}
.hero .illus{width:88px;height:88px;flex:none;}
.hero .ring-wrap{position:absolute;top:10px;right:10px;width:56px;height:56px;}
.hero .ring-wrap svg{transform:rotate(-90deg);}
.hero .ring-wrap .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.hero .ring-wrap .num b{font:700 13px/1 'Montserrat',sans-serif;}
.hero .ring-wrap .num span{font:600 6.5px/1 'Montserrat',sans-serif;color:var(--muted);}
.hero .pct{margin-left:12px;font:400 12px/1.35 'Montserrat',sans-serif;color:#544d3c;max-width:180px;}
.hero .pct b{color:var(--ink);font-weight:700;}

.macros{display:flex;gap:8px;margin-bottom:10px;flex:none;}
.macro{flex:1;border-radius:12px;padding:8px 6px;text-align:center;background:var(--bg);}
.macro b{display:block;font:700 16px/1.1 'Montserrat',sans-serif;color:var(--fg);}
.macro span{font:600 9px/1 'Montserrat',sans-serif;color:var(--fg);opacity:.65;}

.section-head{flex:none;font:600 11px/1 'Montserrat',sans-serif;color:var(--muted);margin-bottom:4px;}
.ing-scroll{flex:1;min-height:0;overflow-y:auto;}
.ing-row{display:flex;align-items:baseline;gap:6px;padding:6px 0;border-bottom:1px dotted var(--line);}
.ing-row .swatch{width:6px;height:6px;border-radius:50%;background:var(--hue,#C7684F);flex:none;}
.ing-row .name{font:400 13px/1.2 'Montserrat',sans-serif;}
.ing-row .leader{flex:1;border-bottom:1px dotted var(--line);margin-bottom:3px;min-width:10px;}
.ing-row .amt{font:600 11px/1 'Montserrat',sans-serif;color:var(--muted);white-space:nowrap;}

.daytotal{flex:none;margin-top:10px;background:var(--ink);color:var(--paper);border-radius:16px;
  padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-end;}
.daytotal .lbl{font:600 10.5px/1 'Montserrat',sans-serif;color:#B8B2A0;margin-bottom:4px;}
.daytotal .kcal{font:600 22px/1 'Montserrat',sans-serif;color:var(--hue,#C7DE3A);}
.daytotal .macros2{text-align:right;font:500 11px/1.5 'Montserrat',sans-serif;color:#D8D3C4;}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#141210;--line:#332F26;--ink:#F3EFE2;--muted:#948D78;}
  .hero{background:linear-gradient(135deg,var(--hue-d,#2b241f),var(--paper) 85%);}
}
</style>
</head>

function ring(pct,hue){
  const r=22, c=2*Math.PI*r, off=c*(1-pct);
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="#ffffffa0" stroke-width="6"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="${hue}" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}

    <div class="macros2">${t.p}g protein<br>${t.c}g carbs · ${t.f}g fats</div>
  `;

  daysEl.querySelectorAll('.day-btn').forEach(b=>b.onclick=()=>{day=b.dataset.d;meal=0;render();});
  mealTabsEl.querySelectorAll('.meal-tab').forEach(b=>b.onclick=()=>{meal=+b.dataset.i;render();});
}
render();
</script>
</body>
</html>
